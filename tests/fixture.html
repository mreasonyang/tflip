<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VECTOR browser verification</title>
<style>
body{margin:0;min-height:1500px;background:#f4f5ee;font-family:system-ui;color:#25382e}
main{padding:150px 60px;display:flex;justify-content:space-between;gap:50px;max-width:900px}
.slot{width:220px;height:140px;display:grid;place-items:center;border:1px dashed #83967b}
.card{box-sizing:border-box;width:180px;height:110px;background:#f9faf4;border:1px solid #aebca6;border-radius:12px;box-shadow:0 6px 18px #2f422022;padding:20px}
.card strong{display:block;margin-bottom:15px;color:#e3613b}.business{transform:rotate(2deg)}
</style>
<main><div id="source" class="slot"><div id="wrapper"><button id="business" class="card business"><strong>VECTOR</strong>Business content</button></div></div><div id="target" class="slot">Destination</div></main>
</html>
